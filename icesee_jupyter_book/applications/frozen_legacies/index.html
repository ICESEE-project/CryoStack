<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Frozen Legacies | CryoStack</title>

  <!-- OpenLayers -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css"
  >

  <!-- FrozenLegacies styles -->
  <link
    rel="stylesheet"
    href="/_static/icesee.css"
  >
  <link
    rel="stylesheet"
    href="/frozen-legacies/assets/frozen_legacies.css"
  >
</head>

<body>

  <header class="fl-topbar">

    <nav class="fl-topnav">

      <div class="fl-topnav-left">

        <a
          href="/frozen-legacies/"
          class="fl-topnav-brand active"
        >
          Frozen Legacies
        </a>

        <a
          href="/applications/frozen_legacies/getting_started.html"
          class="fl-topnav-link"
        >
          Getting Started
        </a>

        <a
          href="/applications/frozen_legacies/user_manual.html"
          class="fl-topnav-link"
        >
          User Manual
        </a>

        <a
          href="/applications/frozen_legacies/developer.html"
          class="fl-topnav-link"
        >
          Developer Guide
        </a>

      </div>


      <div class="fl-topnav-right">

        <div
          id="cryostack-account-slot"
          class="fl-account-slot"
        >
        </div>

      </div>

    </nav>

  </header>

    <main class="fl-main">

      <!-- ==========================================
           Antarctic map
           ========================================== -->

      <section class="fl-map-card">

        <div
          id="frozen-legacies-map"
          class="fl-map"
        ></div>

      </section>


      <!-- ==========================================
           Dataset explorer
           ========================================== -->

      <aside class="fl-panel">

        <div class="fl-panel-heading">

          <div>
            <div class="fl-panel-eyebrow">
              DATASET EXPLORER
            </div>

            <h2>
              Explore observations
            </h2>
          </div>

        </div>

        <div class="fl-control">

          <label for="dataset-select">
            Dataset
          </label>

          <select id="dataset-select">

            <option value="all">
              All datasets
            </option>

          </select>

        </div>
                

        <div class="fl-control">

          <label for="flight-select">
            Flight
          </label>

          <select id="flight-select">

            <option value="all">
              All flights
            </option>

          </select>

        </div>


        <div class="fl-panel-divider"></div>


        <div id="selected-record">

          <div class="fl-empty-selection">

            <div class="fl-empty-icon">
              ⌖
            </div>

            <div>

              <strong>
                Select a radar observation
              </strong>

              <span>
                Click a point on the Antarctic map to inspect
                the LYRA-derived radar record.
              </span>

            </div>

          </div>

        </div>

      </aside>

    </main>

  </div>


  <!-- Projection support -->
<script
  src="https://cdn.jsdelivr.net/npm/proj4@2.15.0/dist/proj4.js">
</script>


<!-- OpenLayers -->
<script
  src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js">
</script>


<!-- FrozenLegacies map core -->
<script
  src="/frozen-legacies/assets/map.js">
</script>


<!-- FrozenLegacies cartographic styles -->
<script
  src="/frozen-legacies/assets/styles.js">
</script>


<!-- FrozenLegacies sources and layers -->
<script
  src="/frozen-legacies/assets/layers.js">
</script>


<!-- FrozenLegacies data -->
<script
  src="/frozen-legacies/assets/data.js">
</script>


<!-- FrozenLegacies interaction/UI -->
<script
  src="/frozen-legacies/assets/ui.js">
</script>

<!-- CryoStack Account -->
<script
  src="/_static/cryostack_account.js">
</script>

<!-- FrozenLegacies application entry point -->
<script
  src="/frozen-legacies/assets/frozen_legacies.js">
</script>

</body>
</html>
