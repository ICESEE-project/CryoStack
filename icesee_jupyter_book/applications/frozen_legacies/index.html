<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Frozen Legacies | CryoStack</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <link
    href="/frozen-legacies/assets/frozen_legacies.css"
    rel="stylesheet"
  >
</head>

<body>

  <div class="fl-page">

    <header class="fl-header">
      <div>
        <div class="fl-eyebrow">
          CRYOSTACK · HISTORICAL RADAR
        </div>

        <h1>Frozen Legacies</h1>

        <p>
          Explore restored Antarctic airborne radar observations
          and LYRA-derived geophysical products.
        </p>
      </div>
    </header>

    <main class="fl-main">

      <section class="fl-map-card">
        <div id="frozen-legacies-map"></div>
      </section>

      <aside class="fl-panel">
        <h2>Dataset Explorer</h2>

        <label for="flight-select">
          Flight
        </label>

        <select id="flight-select">
          <option value="all">
            All flights
          </option>
        </select>

        <hr>

        <div id="selected-record">
          Click a radar observation on the map.
        </div>
      </aside>

    </main>

  </div>

  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>

  <script src="/frozen-legacies/assets/frozen_legacies.js"></script>

</body>
</html>
