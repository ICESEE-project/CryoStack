id: frozen-legacies-lyra

title: Frozen Legacies LYRA Radar Observations

adapter: lyra

campaign: Frozen Legacies

institution: Georgia Tech

description: >
  Restored Antarctic airborne radar observations and
  LYRA-derived geophysical products.


metadata:

  project: Frozen Legacies

  product_family: LYRA

  coordinate_system: EPSG:4326

  version: 1.0

  citation: null

  doi: null


# ============================================================
# Current adapter compatibility
#
# dataset_registry.py / LYRAAdapter currently use source.path.
# Keep this until the registry is migrated to storage.root.
# ============================================================

source:

  type: local

  path: external/FrozenLegacies/Frozen Legacy Tools/LYRA Output


# ============================================================
# Future storage abstraction
# ============================================================

storage:

  type: local        # local | cidar | s3 | https

  root: external/FrozenLegacies/Frozen Legacy Tools/LYRA Output


build:

  observations: true

  flights: true

  include_products: true

  downloads:

    observations_csv: true

    observations_geojson: true

    flights_geojson: true


products:

  radargram:

    title: Radargram

    type: image

    path:

      field: radar_image

    downloadable: true


  echogram:

    title: Processed Echogram

    type: image

    path:

      template: media/{flight}/{file_id}.png

    downloadable: true


  source_csv:

    title: Source CSV

    type: data

    path:

      template: downloads/{_source_file}

    downloadable: true


capabilities:

  observations: true

  flight_lines: true

  imagery: false

  downloads: true

  citations: true

  search: false