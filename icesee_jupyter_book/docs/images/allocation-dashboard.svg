<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">CryoStack allocation dashboard schematic</title><desc id="desc">An overview of budget composition, funding policies, user allowances and audit, connected to the existing authenticated transaction ledger. Actual BYO workloads use a separate user-owned AWS account path.</desc>
