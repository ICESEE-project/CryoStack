<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">CryoStack applications and execution access</title>
  <desc id="desc">CryoStack contains four first-class applications -- CryoLauncher, ICESEE, Frozen Legacies, and LIVIST. CryoLauncher and ICESEE each implement their own Remote and Cloud execution; ICESEE additionally has a Local mode. Remote access is by direct SSH or the shared Connector/Relay, reaching an institutional/HPC resource. Cloud submits to AWS compute resources (Fargate or EC2 On-Demand). The same Connector/Relay can, when required, also carry a Cloud workload's connection to a private institutional service -- shown as a small dashed exception, not a normal path. Frozen Legacies and LIVIST are equally first-class applications with their own interaction models, not organized around Local/Remote/Cloud.</desc>
  <defs>
    <style>
      text { font-family: Arial, "DejaVu Sans", sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #153445; }
      .layer { font-size: 13px; font-weight: 700; fill: #36576a; letter-spacing: 1px; }
      .app-title { font-size: 19px; font-weight: 700; fill: #153445; }
      .tag { font-size: 12px; font-weight: 700; fill: #46647a; font-style: italic; }
      .box-title { font-size: 14px; font-weight: 700; fill: #153445; }
      .body { font-size: 13px; fill: #36576a; }
      .small { font-size: 11.5px; fill: #4a6577; }
      .infra-title { font-size: 14px; font-weight: 700; fill: #153445; }
      .note { font-size: 12px; fill: #46647a; }
      .arrow { stroke: #54768a; stroke-width: 2; fill: none; }
      .arrow-special { stroke: #9c8a4e; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowhead-special); }
    </style>
    <marker id="arrowhead-special" markerWidth="9" markerHeight="9" refX="7" refY="2.6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,5.2 L7.5,2.6 z" fill="#9c8a4e"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%"><feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#153445" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1400" height="700" rx="20" fill="#f7fafb"/>
  <text x="700" y="38" text-anchor="middle" class="title">CryoStack: Applications and Execution Access</text>

  <text x="18" y="90" class="layer">APPS</text>

  <!-- ===================== CryoLauncher ===================== -->
  <rect x="110" y="60" width="280" height="52" rx="12" fill="#fff4da" stroke="#d6a33c" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="93" text-anchor="middle" class="app-title">CryoLauncher</text>

  <rect x="110" y="122" width="280" height="200" rx="14" fill="#fffaf0" stroke="#e3bd6e" stroke-width="1.5"/>
  <text x="250" y="147" text-anchor="middle" class="tag">Basic / Advanced configuration</text>
  <line x1="128" y1="158" x2="372" y2="158" stroke="#e3bd6e" stroke-width="1"/>

  <rect x="150" y="174" width="200" height="27" rx="8" fill="#ffffff" stroke="#cf9f4a" stroke-width="1.3"/>
  <text x="250" y="192" text-anchor="middle" class="box-title">Remote</text>
  <rect x="150" y="209" width="200" height="27" rx="8" fill="#ffffff" stroke="#cf9f4a" stroke-width="1.3"/>
  <text x="250" y="227" text-anchor="middle" class="box-title">Cloud &#8212; AWS</text>

  <line x1="150" y1="254" x2="350" y2="254" stroke="#e3bd6e" stroke-width="1"/>
  <text x="250" y="278" text-anchor="middle" class="body">ISSM &#183; Icepack</text>

  <!-- ===================== ICESEE ===================== -->
  <rect x="410" y="60" width="280" height="52" rx="12" fill="#e2f1e7" stroke="#57916c" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="93" text-anchor="middle" class="app-title">ICESEE</text>

  <rect x="410" y="122" width="280" height="200" rx="14" fill="#f2f9f4" stroke="#8dbb9c" stroke-width="1.5"/>
  <text x="550" y="147" text-anchor="middle" class="tag">Ensemble data assimilation</text>
  <line x1="428" y1="158" x2="672" y2="158" stroke="#8dbb9c" stroke-width="1"/>

  <rect x="450" y="171" width="200" height="24" rx="8" fill="#ffffff" stroke="#6fa682" stroke-width="1.3"/>
  <text x="550" y="187" text-anchor="middle" class="box-title">Local</text>
  <rect x="450" y="201" width="200" height="24" rx="8" fill="#ffffff" stroke="#6fa682" stroke-width="1.3"/>
  <text x="550" y="217" text-anchor="middle" class="box-title">Remote</text>
  <rect x="450" y="231" width="200" height="24" rx="8" fill="#ffffff" stroke="#6fa682" stroke-width="1.3"/>
  <text x="550" y="247" text-anchor="middle" class="box-title">Cloud</text>

  <line x1="450" y1="264" x2="650" y2="264" stroke="#8dbb9c" stroke-width="1"/>
  <text x="550" y="288" text-anchor="middle" class="body">Lorenz-96 &#183; ISSM coupling</text>

  <!-- ===================== Frozen Legacies ===================== -->
  <rect x="710" y="60" width="280" height="52" rx="12" fill="#f4e7e2" stroke="#ad7965" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="93" text-anchor="middle" class="app-title">Frozen Legacies</text>

  <rect x="710" y="122" width="280" height="200" rx="14" fill="#fbf3f0" stroke="#cba599" stroke-width="1.5"/>
  <text x="850" y="210" text-anchor="middle" class="body">Historical Antarctic radar</text>
  <text x="850" y="234" text-anchor="middle" class="small">Catalog &#183; interpretation &#183; tracing</text>

  <!-- ===================== LIVIST ===================== -->
  <rect x="1010" y="60" width="280" height="52" rx="12" fill="#e8e6f5" stroke="#7770a9" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="93" text-anchor="middle" class="app-title">LIVIST</text>

  <rect x="1010" y="122" width="280" height="200" rx="14" fill="#f4f3fa" stroke="#b5b1d9" stroke-width="1.5"/>
  <text x="1150" y="210" text-anchor="middle" class="body">Englacial temperature products</text>
  <text x="1150" y="234" text-anchor="middle" class="small">Radar &#183; borehole observations</text>

  <!-- ===================== Level 2: Access / Execution ===================== -->
  <text x="18" y="410"><tspan x="18" dy="0" class="layer">ACCESS /</tspan><tspan x="18" dy="16" class="layer">EXECUTION</tspan></text>

  <!-- CryoLauncher's own bus (Remote + Cloud only) -->
  <path d="M250 322 L250 350" class="arrow"/>
  <path d="M250 350 L590 350" class="arrow"/>
  <path d="M370 350 L370 384" class="arrow"/>
  <path d="M590 350 L590 384" class="arrow"/>

  <!-- ICESEE's own bus (Local + Remote + Cloud) -->
  <path d="M550 322 L550 366" class="arrow"/>
  <path d="M180 366 L590 366" class="arrow"/>
  <path d="M180 366 L180 384" class="arrow"/>
  <path d="M370 366 L370 384" class="arrow"/>
  <path d="M590 366 L590 384" class="arrow"/>

  <rect x="110" y="384" width="140" height="66" rx="12" fill="#e3ebee" stroke="#6f8b9a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="180" y="411" text-anchor="middle" class="infra-title">Local</text>
  <text x="180" y="431" text-anchor="middle" class="small">Application host</text>

  <rect x="270" y="384" width="200" height="66" rx="12" fill="#e3ebee" stroke="#6f8b9a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="370" y="405" text-anchor="middle" class="infra-title">Remote</text>
  <text x="370" y="424" text-anchor="middle" class="small">Direct SSH</text>
  <text x="370" y="440" text-anchor="middle" class="small">Connector / Relay</text>

  <rect x="490" y="384" width="200" height="66" rx="12" fill="#e3ebee" stroke="#6f8b9a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="590" y="405" text-anchor="middle" class="infra-title">Cloud</text>
  <text x="590" y="424" text-anchor="middle" class="small">AWS Fargate</text>
  <text x="590" y="440" text-anchor="middle" class="small">EC2 On-Demand</text>

  <!-- Private institutional service: small dashed side annotation from Cloud -->
  <path d="M690 417 L724 417" class="arrow-special"/>
  <rect x="726" y="384" width="230" height="66" rx="12" fill="#fbf6e8" stroke="#c9ad6a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="841" y="405" text-anchor="middle" class="box-title">Private institutional service</text>
  <text x="841" y="423" text-anchor="middle" class="small">e.g. MATLAB licensing</text>
  <text x="841" y="439" text-anchor="middle" class="small">via Connector / Relay, when required</text>

  <!-- ===================== Level 3: Resources / Services ===================== -->
  <text x="18" y="512" class="layer">RESOURCES</text>

  <path d="M370 450 L370 470" class="arrow"/>
  <path d="M590 450 L590 470" class="arrow"/>

  <rect x="270" y="470" width="200" height="52" rx="12" fill="#fff8e5" stroke="#c49a36" stroke-width="1.8"/>
  <text x="370" y="493" text-anchor="middle" class="infra-title">Institutional /</text>
  <text x="370" y="511" text-anchor="middle" class="infra-title">HPC resources</text>

  <rect x="490" y="470" width="200" height="52" rx="12" fill="#e8f0f7" stroke="#5c8aab" stroke-width="1.8"/>
  <text x="590" y="493" text-anchor="middle" class="infra-title">AWS compute</text>
  <text x="590" y="511" text-anchor="middle" class="infra-title">resources</text>

  <!-- ===================== Bottom note ===================== -->
  <rect x="110" y="556" width="1180" height="60" rx="12" fill="#eef2f4" stroke="#a9bac3" stroke-width="1.2"/>
  <text x="700" y="580" text-anchor="middle" class="note">Connector / Relay is connectivity, not an execution backend. It is used for Remote access and, when required,</text>
  <text x="700" y="600" text-anchor="middle" class="note">for Cloud access to a private institutional service &#8212; ordinary Cloud execution does not require it.</text>
</svg>
