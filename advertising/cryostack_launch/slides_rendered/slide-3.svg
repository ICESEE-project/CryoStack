<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><style>
    text{font-family:'DejaVu Sans',Arial,sans-serif}.kicker{font-size:18px;font-weight:700;letter-spacing:2px;fill:#087EEB}.title{font-size:52px;font-weight:700;fill:#082B59}.subtitle{font-size:26px;fill:#5E7187}.body{font-size:25px;fill:#172033}.flow{font-size:19px;font-weight:700;fill:#082B59}.arrow{font-size:30px;fill:#087EEB}.cardhead{font-size:31px;font-weight:700;fill:#082B59}.cardbody{font-size:21px;fill:#5E7187}.ctabig{font-size:38px;font-weight:700;fill:#fff}.ctasmall{font-size:22px;fill:#fff}</style>
    <rect width="1920" height="1080" fill="#F8FBFD"/><rect width="1920" height="16" fill="#087EEB"/><text x="105" y="78" class="kicker">CRYOSTACK</text><text x="105" y="155" class="title">From computational code to a scientific gateway</text><text x="105" y="208" class="subtitle">Users retain their own institutional HPC identity and credentials.</text>
    <text x="105" y="300" class="body"><tspan x="105" dy="0">Configure through a browser application. Pair the CryoStack Connector.</tspan><tspan x="105" dy="42">Launch supported computations through Slurm. Monitor the run.</tspan><tspan x="105" dy="42">Inspect, visualize, and download managed results.</tspan></text><rect x="125.0" y="485" width="211.66666666666666" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="230.83333333333331" y="547" text-anchor="middle" class="flow">Research code</text><text x="348.66666666666663" y="550" text-anchor="middle" class="arrow">→</text><rect x="361.66666666666663" y="485" width="211.66666666666666" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="467.49999999999994" y="547" text-anchor="middle" class="flow">CryoStack app</text><text x="585.3333333333333" y="550" text-anchor="middle" class="arrow">→</text><rect x="598.3333333333333" y="485" width="211.66666666666666" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="704.1666666666666" y="547" text-anchor="middle" class="flow">Connector</text><text x="821.9999999999999" y="550" text-anchor="middle" class="arrow">→</text><rect x="835.0" y="485" width="211.66666666666666" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="940.8333333333334" y="547" text-anchor="middle" class="flow">HPC / Slurm</text><text x="1058.6666666666667" y="550" text-anchor="middle" class="arrow">→</text><rect x="1071.6666666666665" y="485" width="211.66666666666666" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="1177.4999999999998" y="547" text-anchor="middle" class="flow">Computation</text><text x="1295.3333333333333" y="550" text-anchor="middle" class="arrow">→</text><rect x="1308.3333333333333" y="485" width="211.66666666666666" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="1414.1666666666665" y="547" text-anchor="middle" class="flow">Results</text><text x="1815" y="1035" text-anchor="end" class="kicker">ICCL + PGSL · GEORGIA TECH</text></svg>