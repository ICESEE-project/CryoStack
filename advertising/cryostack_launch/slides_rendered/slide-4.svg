<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><style>
    text{font-family:'DejaVu Sans',Arial,sans-serif}.kicker{font-size:18px;font-weight:700;letter-spacing:2px;fill:#087EEB}.title{font-size:52px;font-weight:700;fill:#082B59}.subtitle{font-size:26px;fill:#5E7187}.body{font-size:25px;fill:#172033}.flow{font-size:19px;font-weight:700;fill:#082B59}.arrow{font-size:30px;fill:#087EEB}.cardhead{font-size:31px;font-weight:700;fill:#082B59}.cardbody{font-size:21px;fill:#5E7187}.ctabig{font-size:38px;font-weight:700;fill:#fff}.ctasmall{font-size:22px;fill:#fff}</style>
    <rect width="1920" height="1080" fill="#F8FBFD"/><rect width="1920" height="16" fill="#087EEB"/><text x="105" y="78" class="kicker">CRYOSTACK</text><text x="105" y="155" class="title">1. Set up your account and HPC resource</text><text x="105" y="208" class="subtitle">Personal resource settings remain scoped to your CryoStack account.</text>
    <text x="105" y="300" class="body"></text><rect x="105" y="350" width="465" height="340" rx="24" fill="#fff" stroke="#D8E7F1"/><rect x="105" y="350" width="465" height="12" rx="6" fill="#087EEB"/><text x="139" y="420" class="cardhead">Sign in</text><text x="139" y="468" class="cardbody"><tspan x="139" dy="0">Open CryoStack and sign in with</tspan><tspan x="139" dy="32">your account before starting a</tspan><tspan x="139" dy="32">persistent modeling workspace.</tspan></text><rect x="625" y="350" width="465" height="340" rx="24" fill="#fff" stroke="#D8E7F1"/><rect x="625" y="350" width="465" height="12" rx="6" fill="#24B8E8"/><text x="659" y="420" class="cardhead">Choose the resource</text><text x="659" y="468" class="cardbody"><tspan x="659" dy="0">Select the configured HPC resource</tspan><tspan x="659" dy="32">and access mode. PACE/Phoenix</tspan><tspan x="659" dy="32">supports Connector or direct access.</tspan></text><rect x="1145" y="350" width="465" height="340" rx="24" fill="#fff" stroke="#D8E7F1"/><rect x="1145" y="350" width="465" height="12" rx="6" fill="#177A55"/><text x="1179" y="420" class="cardhead">Enter your details</text><text x="1179" y="468" class="cardbody"><tspan x="1179" dy="0">Provide your HPC username, remote</tspan><tspan x="1179" dy="32">working directory, Slurm allocation,</tspan><tspan x="1179" dy="32">and notification email as required.</tspan></text><text x="1815" y="1035" text-anchor="end" class="kicker">ICCL + PGSL · GEORGIA TECH</text></svg>