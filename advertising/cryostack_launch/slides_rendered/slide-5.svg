<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><style>
    text{font-family:'DejaVu Sans',Arial,sans-serif}.kicker{font-size:18px;font-weight:700;letter-spacing:2px;fill:#087EEB}.title{font-size:52px;font-weight:700;fill:#082B59}.subtitle{font-size:26px;fill:#5E7187}.body{font-size:25px;fill:#172033}.flow{font-size:19px;font-weight:700;fill:#082B59}.arrow{font-size:30px;fill:#087EEB}.cardhead{font-size:31px;font-weight:700;fill:#082B59}.cardbody{font-size:21px;fill:#5E7187}.ctabig{font-size:38px;font-weight:700;fill:#fff}.ctasmall{font-size:22px;fill:#fff}</style>
    <rect width="1920" height="1080" fill="#F8FBFD"/><rect width="1920" height="16" fill="#087EEB"/><text x="105" y="78" class="kicker">CRYOSTACK</text><text x="105" y="155" class="title">2. Pair the CryoStack Connector</text><text x="105" y="208" class="subtitle">The Connector uses your workstation and your institutional HPC access.</text>
    <text x="105" y="300" class="body"><tspan x="105" dy="0">Stay connected to any institutionally required VPN.</tspan><tspan x="105" dy="42">Open Connector Setup from CryoLauncher, install the published connector,</tspan><tspan x="105" dy="42">launch it, enter the one-time pairing code, and confirm Connected status.</tspan></text><rect x="125.0" y="485" width="259.0" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="254.5" y="547" text-anchor="middle" class="flow">Connector Setup</text><text x="396.0" y="550" text-anchor="middle" class="arrow">→</text><rect x="409.0" y="485" width="259.0" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="538.5" y="547" text-anchor="middle" class="flow">Download</text><text x="680.0" y="550" text-anchor="middle" class="arrow">→</text><rect x="693.0" y="485" width="259.0" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="822.5" y="547" text-anchor="middle" class="flow">Launch</text><text x="964.0" y="550" text-anchor="middle" class="arrow">→</text><rect x="977.0" y="485" width="259.0" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="1106.5" y="547" text-anchor="middle" class="flow">Pairing code</text><text x="1248.0" y="550" text-anchor="middle" class="arrow">→</text><rect x="1261.0" y="485" width="259.0" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="1390.5" y="547" text-anchor="middle" class="flow">Connected</text><text x="1815" y="1035" text-anchor="end" class="kicker">ICCL + PGSL · GEORGIA TECH</text></svg>