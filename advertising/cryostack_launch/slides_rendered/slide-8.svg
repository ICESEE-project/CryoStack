<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><style>
    text{font-family:'DejaVu Sans',Arial,sans-serif}.kicker{font-size:18px;font-weight:700;letter-spacing:2px;fill:#087EEB}.title{font-size:52px;font-weight:700;fill:#082B59}.subtitle{font-size:26px;fill:#5E7187}.body{font-size:25px;fill:#172033}.flow{font-size:19px;font-weight:700;fill:#082B59}.arrow{font-size:30px;fill:#087EEB}.cardhead{font-size:31px;font-weight:700;fill:#082B59}.cardbody{font-size:21px;fill:#5E7187}.ctabig{font-size:38px;font-weight:700;fill:#fff}.ctasmall{font-size:22px;fill:#fff}</style>
    <rect width="1920" height="1080" fill="#F8FBFD"/><rect width="1920" height="16" fill="#087EEB"/><text x="105" y="78" class="kicker">CRYOSTACK</text><text x="105" y="155" class="title">Explore CryoStack</text><text x="105" y="208" class="subtitle">Distinct applications connected through one platform</text>
    <text x="105" y="300" class="body"></text><rect x="105" y="300" width="800" height="250" rx="24" fill="#fff" stroke="#D8E7F1"/><rect x="105" y="300" width="800" height="12" rx="6" fill="#087EEB"/><text x="139" y="370" class="cardhead">CryoLauncher</text><text x="139" y="418" class="cardbody"><tspan x="139" dy="0">Configure and launch supported ISSM</tspan><tspan x="139" dy="32">and Icepack modeling workflows on</tspan><tspan x="139" dy="32">remote and Slurm-managed systems.</tspan></text><rect x="960" y="300" width="800" height="250" rx="24" fill="#fff" stroke="#D8E7F1"/><rect x="960" y="300" width="800" height="12" rx="6" fill="#24B8E8"/><text x="994" y="370" class="cardhead">ICESEE</text><text x="994" y="418" class="cardbody"><tspan x="994" dy="0">Configure ensemble data-assimilation</tspan><tspan x="994" dy="32">workflows for supported numerical</tspan><tspan x="994" dy="32">models and filtering methods.</tspan></text><rect x="105" y="600" width="800" height="250" rx="24" fill="#fff" stroke="#D8E7F1"/><rect x="105" y="600" width="800" height="12" rx="6" fill="#177A55"/><text x="139" y="670" class="cardhead">LIVIST</text><text x="139" y="718" class="cardbody"><tspan x="139" dy="0">Explore Antarctic ice-sheet temperature</tspan><tspan x="139" dy="32">products inferred from radar and</tspan><tspan x="139" dy="32">constrained by borehole observations.</tspan></text><rect x="960" y="600" width="800" height="250" rx="24" fill="#fff" stroke="#D8E7F1"/><rect x="960" y="600" width="800" height="12" rx="6" fill="#082B59"/><text x="994" y="670" class="cardhead">Frozen Legacies</text><text x="994" y="718" class="cardbody"><tspan x="994" dy="0">Explore historical Antarctic airborne</tspan><tspan x="994" dy="32">radar surveys, flight tracks, and</tspan><tspan x="994" dy="32">processed campaign observations.</tspan></text><text x="1815" y="1035" text-anchor="end" class="kicker">ICCL + PGSL · GEORGIA TECH</text></svg>