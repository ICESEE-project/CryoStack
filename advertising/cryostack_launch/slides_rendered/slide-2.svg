    <rect width="1920" height="1080" fill="#F8FBFD"/><rect width="1920" height="16" fill="#087EEB"/><text x="105" y="78" class="kicker">CRYOSTACK</text><text x="105" y="155" class="title">Ice-sheet models are powerful — but difficult to get running</text><text x="105" y="208" class="subtitle">The setup remains real; CryoStack provides a supported path through it.</text>
    <text x="105" y="300" class="body"><tspan x="105" dy="0">Dependencies, compilation, HPC configuration, schedulers, and</tspan><tspan x="105" dy="42">model-specific workflows can slow down students, observational scientists,</tspan><tspan x="105" dy="42">and researchers entering computational ice-sheet modeling.</tspan></text><rect x="125.0" y="485" width="177.85714285714286" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="213.92857142857144" y="547" text-anchor="middle" class="flow">Scientific model</text><text x="314.8571428571429" y="550" text-anchor="middle" class="arrow">→</text><rect x="327.8571428571429" y="485" width="177.85714285714286" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="416.78571428571433" y="547" text-anchor="middle" class="flow">Dependencies</text><text x="517.7142857142858" y="550" text-anchor="middle" class="arrow">→</text><rect x="530.7142857142858" y="485" width="177.85714285714286" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="619.6428571428572" y="547" text-anchor="middle" class="flow">Compilation</text><text x="720.5714285714287" y="550" text-anchor="middle" class="arrow">→</text><rect x="733.5714285714286" y="485" width="177.85714285714286" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="822.5" y="547" text-anchor="middle" class="flow">HPC setup</text><text x="923.4285714285714" y="550" text-anchor="middle" class="arrow">→</text><rect x="936.4285714285714" y="485" width="177.85714285714286" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="1025.357142857143" y="547" text-anchor="middle" class="flow">Slurm</text><text x="1126.2857142857142" y="550" text-anchor="middle" class="arrow">→</text><rect x="1139.2857142857142" y="485" width="177.85714285714286" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="1228.2142857142856" y="547" text-anchor="middle" class="flow">Workflow</text><text x="1329.142857142857" y="550" text-anchor="middle" class="arrow">→</text><rect x="1342.142857142857" y="485" width="177.85714285714286" height="105" rx="18" fill="#EEF7FC" stroke="#24B8E8"/><text x="1431.0714285714284" y="547" text-anchor="middle" class="flow">Simulation</text><text x="1815" y="1035" text-anchor="end" class="kicker">ICCL + PGSL · GEORGIA TECH</text></svg>