# CryoStack -- single nginx server definition for cryostack.eas.gatech.edu.
#
# The `map $http_upgrade $connection_upgrade` lives in 00-websocket-map.conf
# (loaded first) and must NOT be repeated here -- a second definition is a
# duplicate-directive error.
#
# This file is the ONLY conf.d entry that owns `server_name
# cryostack.eas.gatech.edu`. deploy_web.sh disables any earlier CryoStack
# server block (e.g. a pre-rename cryolauncher.conf) so there is no
# "conflicting server name ... ignored" warning. The TLS block below carries
# the Certbot-managed certificate paths; renew with `certbot renew` as usual.

# ---- HTTP: ACME + redirect to HTTPS ---------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cryostack.eas.gatech.edu;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: the site ------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cryostack.eas.gatech.edu;

    ssl_certificate     /etc/letsencrypt/live/cryostack.eas.gatech.edu/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cryostack.eas.gatech.edu/privkey.pem;     # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                                    # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                      # managed by Certbot

    client_max_body_size 200M;

    location /connect/ {
        alias /var/www/cryolauncher/connect/;
        index index.html;
    }

    location = /connect {
        return 301 /connect/;
    }

    # CryoStack Connector distributables. Static, session-independent files.
    # Serve the SHA256SUMS / manifest.json inline; everything else as a download.
    location = /downloads/connectors/SHA256SUMS { alias /var/www/cryolauncher/downloads/connectors/SHA256SUMS; default_type text/plain; }
    location = /downloads/connectors/manifest.json { alias /var/www/cryolauncher/downloads/connectors/manifest.json; default_type application/json; }

    # Compatibility redirects: pre-rename connector download paths -> current.
    location = /downloads/Cryolauncher_Connector_macOS_arm64.dmg   { return 301 /downloads/connectors/CryoStack-Connector-macos-arm64.dmg; }
    location = /downloads/Cryolauncher_Connector_macOS_x86_64.dmg  { return 301 /downloads/connectors/CryoStack-Connector-macos-x86_64.dmg; }
    location = /downloads/Cryolauncher_Connector_Linux_x86_64.tar.gz { return 301 /downloads/connectors/CryoStack-Connector-linux-x86_64.tar.gz; }
    location = /downloads/Cryolauncher_Connector_Windows_x86_64.exe { return 301 /downloads/connectors/CryoStack-Connector-windows-x86_64.exe; }
    location = /downloads/ICESEE-Connector-macOS.pkg      { return 301 /downloads/connectors/CryoStack-Connector-macos-arm64.dmg; }
    location = /downloads/ICESEE-Connector-macOS.zip      { return 301 /downloads/connectors/CryoStack-Connector-macos-arm64.dmg; }
    location = /downloads/ICESEE-Connector-Windows.exe    { return 301 /downloads/connectors/CryoStack-Connector-windows-x86_64.exe; }
    location = /downloads/ICESEE-Connector-Linux.AppImage { return 301 /downloads/connectors/CryoStack-Connector-linux-x86_64.tar.gz; }

    location /downloads/connectors/ {
        alias /var/www/cryolauncher/downloads/connectors/;
        autoindex on;

        # nginx has no mime entry for .dmg / .AppImage; force an octet-stream
        # download so browsers save the binary rather than trying to render it.
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
    }

    location /downloads/ {
        alias /var/www/cryolauncher/downloads/;
        autoindex on;
    }

    location /connector/ {
        proxy_pass http://127.0.0.1:8899/connector/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }
}
